name: Source archive validation
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/validate_source.py
